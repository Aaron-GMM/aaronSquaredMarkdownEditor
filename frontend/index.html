<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaron² Editor</title>
    <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
<div id="app-container">
    <header id="titlebar" style="--wails-draggable:drag">
        <div class="titlebar-logo">A² Editor</div>
        <div class="titlebar-controls" style="--wails-draggable:no-drag">
            <button id="window-minimize" class="control-btn" title="Minimizar">─</button>
            <button id="window-maximize" class="control-btn" title="Maximizar">◻</button>
            <button id="window-close" class="control-btn close-btn" title="Fechar">✕</button>
        </div>
    </header>

    <div id="main-content">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>EXPLORER</h2>
                <div class="sidebar-actions">
                    <button id="btn-open-folder" title="Abrir Pasta Externa">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    </button>
                    <button id="btn-new-file" title="Novo Arquivo">...</button>
             
                    <button id="btn-insert-image" title="Inserir Imagem">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    </button>
                    <button id="btn-export-pdf" title="Exportar para PDF">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
                    </button>
                    <input type="file" id="image-upload" accept="image/*" style="display: none;" />
                    <button id="btn-refresh" title="Atualizar">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    </button>
                </div>
            </div>
            <ul id="file-tree"></ul>

            <div class="sidebar-footer">
                <button id="btn-open-terminal">TERMINAL</button>
            </div>
        </aside>

        <div id="sidebar-resizer"></div>

        <main id="workspace">
            <div id="editor-preview-split">
                <div id="editor-container" style="position: relative;">
                    <textarea id="markdown-editor" placeholder="Escreva o seu Markdown... (Digite / para atalhos)"></textarea>

                    <div id="slash-menu" class="slash-menu hidden">
                        <div class="slash-title">Formatação</div>
                        <div class="slash-item selected" data-action="table"><span>📊</span> Tabela</div>
                        <div class="slash-item" data-action="code"><span>💻</span> Código</div>
                        <div class="slash-item" data-action="mermaid"><span>🌊</span> Diagrama</div>
                    </div>
                </div>
                <div id="preview-container">
                    <div id="markdown-preview">O preview aparecerá aqui.</div>
                </div>
            </div>

            <div id="bottom-panel" class="hidden">
                <div class="panel-header">
                    <span>TERMINAL</span>
                    <div class="panel-actions">
                        <button id="btn-close-terminal" title="Encerrar Sessão">✕</button>
                    </div>
                </div>
                <div id="terminal-container"></div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-go.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>

<script src="./src/main.js" type="module"></script>
</body>
</html>
